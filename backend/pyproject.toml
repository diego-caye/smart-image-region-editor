[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-image-region-editor-backend"
version = "0.1.0"
description = "Hexagonal-architecture backend for the Smart Image Region Editor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "pillow>=11.0",
    "numpy>=2.1",
    "httpx>=0.27",
    "websockets>=13.1",
]

[project.optional-dependencies]
# Heavy ML stack for detection/segmentation (Phase 3). torch/torchvision are
# NOT listed here on purpose — they need a CUDA-specific index URL (pinned to
# match ComfyUI's own cu130 build for RTX 5080/Blackwell support) and must be
# installed as a separate step; see backend/README.md.
ml = [
    "ultralytics>=8.3",
    "sam2>=1.0",
    "huggingface-hub>=0.26",
    "mediapipe>=1.0.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live_comfyui: requires a real local ComfyUI server running (opt-in, not run by default)",
    "live_models: requires the real YOLO/SAM2 weights + the ml extra installed (opt-in, not run by default)",
]
addopts = "-m \"not live_comfyui and not live_models\""

[tool.ruff]
line-length = 100
target-version = "py312"
