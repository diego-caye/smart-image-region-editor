name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # The default suite runs on fakes: no GPU, ComfyUI, torch, YOLO or SAM2.
      # mediapipe is the one exception — three tests check landmark index
      # sets against the real package's constants instead of hand copies.
      - run: pip install -e ".[dev]" "mediapipe>=1.0.1"
      - run: ruff check app tests
      - run: pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # build = tsc --noEmit + vite build, so this is also the type check
      - run: npm run build
