services:
  # Vanilla ComfyUI, containerized so cloning this repo is enough to run the
  # whole stack — no separate ComfyUI install required. Its own UI is
  # reachable directly at http://localhost:${COMFYUI_PORT:-8188} if you want
  # to inspect the workflow graph or queue by hand. Models are downloaded
  # into the comfyui_data volume on first start (see comfyui/entrypoint.sh);
  # this takes a while (~31GB) but only happens once.
  comfyui:
    build:
      context: ./comfyui
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    environment:
      # --reserve-vram leaves that many GB free for other software sharing
      # the GPU. Models stay loaded between edits (fast back-to-back edits);
      # the backend asks ComfyUI to unload them after MODELS_IDLE_UNLOAD_SECONDS
      # without an edit, so an idle ComfyUI doesn't hold the GPU.
      COMFYUI_EXTRA_ARGS: ${COMFYUI_EXTRA_ARGS---reserve-vram 4}
    volumes:
      - comfyui_data:/data
    # Remove this whole `deploy` block to run ComfyUI CPU-only on a machine
    # without the nvidia container runtime (editing will be far slower).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8420}:8000"
    environment:
      # Points at the comfyui service above by default. Override to
      # http://host.docker.internal:8188 (or any URL) instead if you'd
      # rather use your own native ComfyUI install (e.g. one with custom
      # nodes/models already set up).
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://comfyui:8188}
      COMFYUI_TIMEOUT_SECONDS: "180.0"
      # Qwen and SAM2 are released after this long without an edit (0 =
      # right after every edit).
      MODELS_IDLE_UNLOAD_SECONDS: ${MODELS_IDLE_UNLOAD_SECONDS:-180}
      STORAGE_ROOT: /app/data/images
      DATABASE_URL: sqlite:////app/data/app.db
      CORS_ALLOW_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5180}","http://127.0.0.1:${FRONTEND_PORT:-5180}"]'
      DETECTION_DEVICE: ${DETECTION_DEVICE:-cpu}
      SEGMENTATION_DEVICE: ${SEGMENTATION_DEVICE:-cuda}
      # Points at the optional bind mount below. If COMFYUI_MODELS_DIR isn't
      # set (or doesn't contain these files), resolve_weights_file() falls
      # back to downloading the same weights from Hugging Face on its own —
      # this mount is purely a "skip the duplicate download" optimization
      # for people who already have a native ComfyUI install, never a hard
      # requirement.
      YOLO_FACE_MODEL_PATH: /comfyui_models/ultralytics/bbox/face_yolov8n.pt
      YOLO_HAND_MODEL_PATH: /comfyui_models/ultralytics/bbox/hand_yolov8n.pt
      SAM2_MODEL_ID: ${SAM2_MODEL_ID:-facebook/sam2-hiera-base-plus}
      MODELS_CACHE_DIR: /app/models_cache
    volumes:
      - backend_data:/app/data
      - models_cache:/app/models_cache
      # Optional: see YOLO_FACE_MODEL_PATH/YOLO_HAND_MODEL_PATH above. Only
      # set COMFYUI_MODELS_DIR if you have a native ComfyUI install whose
      # weights you want to reuse; an absent/empty mount degrades gracefully.
      - ${COMFYUI_MODELS_DIR:-C:/ComfyUI/models}:/comfyui_models:ro
    extra_hosts:
      # Only relevant if COMFYUI_BASE_URL is overridden to
      # host.docker.internal above; harmless no-op otherwise.
      - "host.docker.internal:host-gateway"
    depends_on:
      - comfyui
    # Remove this whole `deploy` block to run detection/segmentation
    # CPU-only (also set SEGMENTATION_DEVICE=cpu above) on a machine without
    # the nvidia container runtime.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time (Vite env vars are compile-time) — this is
        # the URL the *browser* reaches the backend at, i.e. the host's
        # mapped port, not the container-internal one.
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8420}
    ports:
      - "${FRONTEND_PORT:-5180}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  models_cache:
  comfyui_data:
